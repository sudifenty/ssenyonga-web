name: Rebuild SEO pages and sitemap

# The car pages, landing pages and sitemap.xml are plain HTML files generated
# from the live Supabase inventory. This re-runs the generator so they follow
# the stock: new cars get a page, sold cars get marked, sitemap gets today's
# lastmod. Pushing the result makes Vercel redeploy automatically.

on:
  schedule:
    - cron: '0 4 * * *'      # every day at 04:00 UTC (07:00 Kampala)
  workflow_dispatch:          # or run it by hand from the Actions tab
  push:
    branches: [main]
    paths: ['build.mjs']      # and whenever the generator itself changes

permissions:
  contents: write

concurrency:
  group: seo-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate pages, sitemap and robots.txt
        run: node build.mjs

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Inventory unchanged - nothing to commit."
          else
            git commit -m "Rebuild SEO pages and sitemap from live inventory [skip ci]"
            git push
          fi
